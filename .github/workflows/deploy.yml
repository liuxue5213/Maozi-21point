name: 帽子21点 - 构建部署

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_android:
        description: '构建Android APK'
        required: false
        default: 'true'
        type: boolean

jobs:
  # 构建前端
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖
        run: |
          cd frontend
          npm ci

      - name: 构建前端
        run: |
          cd frontend
          npm run build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # 构建Android APK
  build-android:
    runs-on: ubuntu-latest
    needs: build-frontend
    if: github.event.inputs.build_android != 'false'
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 安装前端依赖
        run: |
          cd frontend
          npm ci

      - name: 构建前端
        run: |
          cd frontend
          npm run build

      - name: 同步Capacitor
        run: |
          cd frontend
          npx cap sync android

      - name: 构建Android APK
        run: |
          cd frontend/android
          ./gradlew assembleRelease

      - name: 上传APK
        uses: actions/upload-artifact@v4
        with:
          name: maozi-21point-android
          path: frontend/android/app/build/outputs/apk/release/*.apk
          retention-days: 30

  # 部署到服务器
  deploy:
    runs-on: ubuntu-latest
    needs: build-frontend
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 安装根目录依赖
        run: npm ci

      - name: 安装后端依赖
        run: |
          cd backend
          npm ci --production

      - name: 安装前端依赖
        run: |
          cd frontend
          npm ci

      - name: 构建前端
        run: |
          cd frontend
          npm run build

      - name: 部署到服务器
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script_stop: true
          script: |
            echo "===== 开始部署 帽子21点 ====="
            
            # 创建项目目录
            mkdir -p /www/maozi-21point
            cd /www/maozi-21point
            
            # 如果不存在则克隆，否则拉取最新代码
            if [ ! -d ".git" ]; then
              git clone ${{ github.server_url }}/${{ github.repository }}.git .
            else
              git pull origin main || git pull origin master
            fi
            
            # 安装依赖
            npm ci
            cd backend && npm ci --production && cd ..
            cd frontend && npm ci && npm run build && cd ..
            
            # 使用 PM2 启动/重启后端
            if command -v pm2 &> /dev/null; then
              pm2 restart maozi-21point 2>/dev/null || pm2 start backend/src/index.js --name maozi-21point
              pm2 save
            else
              npm install -g pm2
              pm2 start backend/src/index.js --name maozi-21point
              pm2 save
              pm2 startup
            fi
            
            # 重启 Nginx
            if command -v nginx &> /dev/null; then
              sudo nginx -t && sudo systemctl reload nginx
            fi
            
            echo "===== 部署完成 ====="

      - name: 部署通知
        if: always()
        run: |
          echo "📋 部署状态: ${{ job.status }}"
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ 帽子21点部署成功!"
            echo "🌐 前端: http://${{ secrets.SERVER_HOST }}:60210"
            echo "🔌 后端: http://${{ secrets.SERVER_HOST }}:60215"
          else
            echo "❌ 部署失败，请检查日志"
          fi
