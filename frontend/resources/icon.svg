<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2ecc71"/>
      <stop offset="100%" style="stop-color:#27ae60"/>
    </linearGradient>
    <linearGradient id="hatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
  </defs>
  
  <!-- 背景圆形 -->
  <circle cx="256" cy="256" r="256" fill="url(#bgGrad)"/>
  <circle cx="256" cy="256" r="240" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  
  <!-- 帽子图标 -->
  <g transform="translate(256, 220)">
    <!-- 帽檐 -->
    <ellipse cx="0" cy="50" rx="130" ry="25" fill="url(#hatGrad)"/>
    <!-- 帽顶 -->
    <path d="M -90 50 Q -90 -30 0 -45 Q 110 -30 110 50 L 110 65 Q 0 80 -90 65 Z" fill="url(#hatGrad)"/>
    <!-- 装饰带 -->
    <rect x="-90" y="52" width="180" height="22" rx="5" fill="#e74c3c"/>
    <!-- 顶部装饰 -->
    <ellipse cx="0" cy="-42" rx="18" ry="10" fill="#c0392b"/>
  </g>
  
  <!-- 21点文字 -->
  <text x="256" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="80" font-weight="900" fill="white">21</text>
  
  <!-- 扑克装饰 -->
  <g transform="translate(120, 420) rotate(-15)">
    <rect width="40" height="56" rx="4" fill="white" opacity="0.9"/>
    <text x="20" y="35" text-anchor="middle" font-size="20" fill="#e74c3c">♥</text>
  </g>
  <g transform="translate(352, 420) rotate(15)">
    <rect width="40" height="56" rx="4" fill="white" opacity="0.9"/>
    <text x="20" y="35" text-anchor="middle" font-size="20" fill="#1a1a2e">♠</text>
  </g>
</svg>
