<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1242 2208">
  <defs>
    <linearGradient id="splashBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa"/>
      <stop offset="50%" style="stop-color:#e9ecef"/>
      <stop offset="100%" style="stop-color:#dee2e6"/>
    </linearGradient>
    <linearGradient id="hatGradSplash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="1242" height="2208" fill="url(#splashBg)"/>
  
  <!-- 装饰圆 -->
  <circle cx="1000" cy="300" r="200" fill="#e8fdf5" opacity="0.5"/>
  <circle cx="200" cy="1800" r="180" fill="#fff3ff" opacity="0.5"/>
  
  <!-- 中央帽子 -->
  <g transform="translate(621, 900)">
    <!-- 帽檐 -->
    <ellipse cx="0" cy="60" rx="160" ry="30" fill="url(#hatGradSplash)"/>
    <!-- 帽顶 -->
    <path d="M -110 60 Q -110 -30 0 -45 Q 130 -30 130 60 L 130 80 Q 0 95 -110 80 Z" fill="url(#hatGradSplash)"/>
    <!-- 装饰带 -->
    <rect x="-110" y="62" width="220" height="24" rx="6" fill="#e74c3c"/>
  </g>
  
  <!-- 标题 -->
  <text x="621" y="1150" text-anchor="middle" font-family="Arial, sans-serif" font-size="100" font-weight="900" fill="#1a1a2e">帽子21点</text>
  <text x="621" y="1220" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" fill="#6c757d" letter-spacing="12">CLASSIC BLACKJACK</text>
  
  <!-- 扑克装饰 -->
  <text x="621" y="1400" text-anchor="middle" font-size="60" opacity="0.3">♠ ♥ ♦ ♣</text>
</svg>
